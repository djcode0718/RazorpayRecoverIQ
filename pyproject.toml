[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
]
ignore = [
    "E501", # line length
    "W291", # trailing whitespace
    "W293", # blank line contains whitespace
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["F401", "F841", "E402"]
"backend/scripts/*" = ["F401", "F841", "E402", "F541"]
"backend/app/main.py" = ["F401"]
"backend/app/readiness.py" = ["F401"]
"backend/app/simulation_workflow.py" = ["F401"]
